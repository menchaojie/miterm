[package]
name = "miterm-agent"
version = "0.1.0"
description = "miterm remote session keep-alive agent (PTY broker on 127.0.0.1)"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "miterm-agent"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
parking_lot = "0.12"
portable-pty = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
