[[permission]]
identifier = "allow-host-commands"
description = "Allow listing, saving and deleting saved SSH hosts and categories."
commands.allow = [
  "list_saved_hosts",
  "save_host",
  "update_saved_host",
  "delete_saved_host",
  "touch_saved_host",
  "list_categories",
  "create_category",
  "update_category",
  "delete_category",
  "list_workspace_categories",
  "create_workspace_category",
  "update_workspace_category",
  "delete_workspace_category",
  "list_command_categories",
  "create_command_category",
  "update_command_category",
  "delete_command_category",
  "list_workspaces",
  "save_workspace",
  "update_workspace",
  "delete_workspace",
  "list_commands",
  "save_command",
  "update_command",
  "delete_command",
]
