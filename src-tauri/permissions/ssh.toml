[[permission]]
identifier = "allow-ssh-commands"
description = "Allow SSH/local terminal and SFTP file commands."
commands.allow = [
  "ssh_connect",
  "local_connect",
  "ssh_write",
  "ssh_resize",
  "ssh_disconnect",
  "sftp_list",
  "sftp_upload",
  "sftp_upload_dir",
  "sftp_classify_local_paths",
  "sftp_upload_paths",
  "sftp_download",
  "sftp_download_dir"
]
